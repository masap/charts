{{- /*
Fleet Bundles that deploy the clock check DaemonSet to the Rancher local
cluster (workspace fleet-local) and to the downstream clusters (workspace
fleet-default). Uninstalling the chart or disabling clockCheck deletes the
Bundles, and Fleet then removes the DaemonSet from the clusters.

The manifests contain the Namespace of the DaemonSet, and the Helm release of
Fleet is stored in the default namespace, so that removing the release also
removes the Namespace. A Namespace that Fleet creates for defaultNamespace is
not part of the release and would be left behind, and the deleteNamespace
option of Fleet only applies when a GitRepo or HelmOp is deleted.
*/ -}}
{{- if .Values.clockCheck.enabled }}
{{- if not (.Capabilities.APIVersions.Has "fleet.cattle.io/v1alpha1/Bundle") }}
{{- fail "clockCheck.enabled requires Fleet (fleet.cattle.io/v1alpha1 Bundle), which Rancher installs" }}
{{- end }}
{{- $targets := list }}
{{- if .Values.clockCheck.includeLocalCluster }}
{{- $targets = append $targets (dict "workspace" "fleet-local" "clusterSelector" (dict)) }}
{{- end }}
{{- if not (kindIs "invalid" .Values.clockCheck.clusterSelector) }}
{{- $targets = append $targets (dict "workspace" "fleet-default" "clusterSelector" .Values.clockCheck.clusterSelector) }}
{{- end }}
{{- range $targets }}
---
apiVersion: fleet.cattle.io/v1alpha1
kind: Bundle
metadata:
  name: sr-clock-check
  namespace: {{ .workspace }}
  labels:
    {{- include "rancher-supportability-review.labels" $ | nindent 4 }}
spec:
  # Where Fleet stores the Helm release. Every resource names its namespace.
  defaultNamespace: default
  targets:
  - clusterSelector:
      {{- toYaml .clusterSelector | nindent 6 }}
  resources:
  - name: clock-check.yaml
    content: |
      {{- include "sr.clockCheckManifests" $ | nindent 6 }}
{{- end }}
{{- end }}

{{- define "sr.clockCheckManifests" -}}
{{- $ns := .Values.clockCheck.namespace -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sr-clock-check
  namespace: {{ $ns }}
---
# Node events are recorded in the default namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sr-clock-check
  namespace: default
rules:
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sr-clock-check
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sr-clock-check
subjects:
- kind: ServiceAccount
  name: sr-clock-check
  namespace: {{ $ns }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sr-clock-check
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: sr-clock-check
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sr-clock-check
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sr-clock-check
    spec:
      serviceAccountName: sr-clock-check
      {{- /*
      No imagePullSecrets: privateRegistry.registrySecret only exists in the
      operator namespace of the local cluster, and copying the registry
      credentials into the Bundle would spread them to every cluster. The
      nodes pull the image with their own registry configuration, as they do
      for the Rancher system images and for sonobuoy.
      */}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: clock-checker
        image: {{ template "registry_url" . }}{{ .Values.image.operator.repository }}:{{ .Values.image.operator.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/clock-checker"]
        args:
        - --interval={{ .Values.clockCheck.interval }}
        - --max-offset={{ .Values.clockCheck.maxOffset }}
        - --max-error={{ .Values.clockCheck.maxError }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          {{- toYaml .Values.clockCheck.resources | nindent 10 }}
      nodeSelector:
        {{- include "linux-node-selector" . | nindent 8 }}
      {{- with .Values.clockCheck.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
